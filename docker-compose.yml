services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: azentio
      POSTGRES_PASSWORD: azentio_dev_only
      POSTGRES_DB: azentio_ai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azentio -d azentio_ai"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
